<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Agent Chrome Extension: A Manifest V3 extension with a rule-based reasoning agent over semantic and keyword search.">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}}
  .wide{transform-box:fill-box;transform-origin:left;animation:wide 1.2s cubic-bezier(.2,.8,.2,1) both}
  @keyframes wide{from{transform:scaleX(0)}}
  .in{animation:in .9s ease-out both} @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .edge{stroke-dasharray:120 1400;animation:edge 6s linear infinite} @keyframes edge{to{stroke-dashoffset:-1520}}
  .live{animation:pulse 2s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
</style>
<rect x="1" y="1" width="598" height="198" rx="16" fill="#0f161d" stroke="#1c2a33"/>
<rect class="edge" style="animation-delay:-4s" x="1" y="1" width="598" height="198" rx="16" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
<text class="m" x="26" y="36" font-size="11" letter-spacing="2" fill="#22D3EE">OPEN SOURCE</text>
<text class="m" x="574" y="36" font-size="12" text-anchor="end" fill="#8aa3ad">repo ↗</text>
<text class="s" x="26" y="70" font-size="24" font-weight="700" fill="#E6FDFF">Agent Chrome Extension</text>
<text class="s" x="26" y="100" font-size="14.5" fill="#8aa3ad">A Manifest V3 extension with a rule-based reasoning agent over</text>
<text class="s" x="26" y="120" font-size="14.5" fill="#8aa3ad">semantic and keyword search.</text>
<rect x="26" y="152" width="59" height="22" rx="11" fill="#123842"/><text class="m" x="56" y="167" font-size="11" text-anchor="middle" fill="#22D3EE">agents</text>
<rect x="93.4" y="152" width="66" height="22" rx="11" fill="#123842"/><text class="m" x="127" y="167" font-size="11" text-anchor="middle" fill="#22D3EE">browser</text>
<text class="m" x="574" y="167" font-size="11.5" text-anchor="end" fill="#8aa3ad">updated 28 Nov 2025</text>
<text class="m" x="423" y="167" font-size="11.5" text-anchor="end" fill="#f1e05a">● JavaScript</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img" aria-label="Now building. Proxsoft: a marketplace of AI agents for construction finance, not a single tool. AP automation is the first agent, and it is live. Orbital Browser: coming soon, with the waitlist open. Rootaxe: not out yet, early access open."><style>.s{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
.edge{stroke-dasharray:140 2400;animation:e 9s linear infinite}@keyframes e{to{stroke-dashoffset:-2540}}
.walk{animation:w 7s cubic-bezier(.6,0,.4,1) infinite}</style>
<defs><clipPath id="c"><rect width="600" height="720" rx="22"/></clipPath></defs>
<rect width="600" height="720" rx="22" fill="#fffdf8"/>

<text class="m" x="36" y="62" font-size="17" letter-spacing="3" fill="#9a6408">NOW BUILDING</text>
<text class="m" x="36" y="120" font-size="22" font-weight="700" fill="#9a6408">01</text>
<text class="s" x="88" y="120" font-size="30" font-weight="700" fill="#0b0a09">Proxsoft</text>
<text class="s" x="88" y="156" font-size="22" fill="#5b5750">a marketplace of AI agents for</text>
<text class="s" x="88" y="186" font-size="22" fill="#5b5750">construction finance, not a single tool. AP</text>
<text class="s" x="88" y="216" font-size="22" fill="#5b5750">automation is the first agent, and it is live.</text>
<text class="m" x="36" y="290" font-size="22" font-weight="700" fill="#9a6408">02</text>
<text class="s" x="88" y="290" font-size="30" font-weight="700" fill="#0b0a09">Orbital Browser</text>
<text class="s" x="88" y="326" font-size="22" fill="#5b5750">coming soon, with the waitlist open.</text>
<text class="m" x="36" y="400" font-size="22" font-weight="700" fill="#9a6408">03</text>
<text class="s" x="88" y="400" font-size="30" font-weight="700" fill="#0b0a09">Rootaxe</text>
<text class="s" x="88" y="436" font-size="22" fill="#5b5750">not out yet, early access open.</text>
<rect x=".5" y=".5" width="599" height="719" rx="22" fill="none" stroke="#e0dacb"/>
<rect class="edge" x=".5" y=".5" width="599" height="719" rx="22" fill="none" stroke="#9a6408" stroke-opacity=".7" stroke-width="1.5"/>
</svg>

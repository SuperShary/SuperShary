name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230b0a09&color_dots=%23ebe5d6,%23e3cb93,%23d4ab5c,%23b07a1a,%238a5d12
            dist/github-snake-dark.svg?color_snake=%23f5f2ea&color_dots=%2314131a,%233d2f12,%236b4f1a,%23b08530,%23e9b44c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

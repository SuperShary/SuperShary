<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Monster Energy Scrollytelling: Rotating 3D cans driven by scroll. The second build from the same tutorial series.">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}}
  .wide{transform-box:fill-box;transform-origin:left;animation:wide 1.2s cubic-bezier(.2,.8,.2,1) both}
  @keyframes wide{from{transform:scaleX(0)}}
  .in{animation:in .9s ease-out both} @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .edge{stroke-dasharray:120 1400;animation:edge 6s linear infinite} @keyframes edge{to{stroke-dashoffset:-1520}}
  .live{animation:pulse 2s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
</style>
<rect x="1" y="1" width="598" height="198" rx="16" fill="#0f161d" stroke="#1c2a33"/>
<rect class="edge" style="animation-delay:-5s" x="1" y="1" width="598" height="198" rx="16" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
<text class="m" x="26" y="36" font-size="11" letter-spacing="2" fill="#22D3EE">LIVE PROJECT</text>
<text class="m" x="574" y="36" font-size="12" text-anchor="end" fill="#8aa3ad">live ↗</text>
<text class="s" x="26" y="70" font-size="24" font-weight="700" fill="#E6FDFF">Monster Energy Scrollytelling</text>
<text class="s" x="26" y="100" font-size="14.5" fill="#8aa3ad">Rotating 3D cans driven by scroll. The second build from the same</text>
<text class="s" x="26" y="120" font-size="14.5" fill="#8aa3ad">tutorial series.</text>
<rect x="26" y="152" width="128" height="22" rx="11" fill="#123842"/><text class="m" x="90" y="167" font-size="11" text-anchor="middle" fill="#22D3EE">scroll animation</text>
<rect x="162.4" y="152" width="32" height="22" rx="11" fill="#123842"/><text class="m" x="178" y="167" font-size="11" text-anchor="middle" fill="#22D3EE">3D</text>
<text class="m" x="574" y="167" font-size="11.5" text-anchor="end" fill="#8aa3ad">updated 13 Jan 2026</text>
<text class="m" x="423" y="167" font-size="11.5" text-anchor="end" fill="#8aa3ad">★ 3</text>
<text class="m" x="384" y="167" font-size="11.5" text-anchor="end" fill="#3178c6">● TypeScript</text>
</svg>

name: Profile 3D contribution calendar

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name "Shagun Choudhary"
          git config user.email "shagun@proxsoftglobal.com"
          git add -A profile-3d-contrib
          if git commit -m "chore: refresh 3D contribution calendar"; then
            # Two workflows commit to main on the same push: rebase and retry.
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
              sleep $((i * 5))
            done
            exit 1
          fi

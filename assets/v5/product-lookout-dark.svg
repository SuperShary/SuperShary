<text class="s" x="36" y="475" font-size="38" font-weight="700" letter-spacing="-0.5" fill="#f5f2ea">Lookout</text>
<text class="s" x="36" y="517" font-size="23" fill="#a8a49b">One private memory of your meetings that</text>
<text class="s" x="36" y="549" font-size="23" fill="#a8a49b">you can ask from Claude Code, with every</text>
<text class="s" x="36" y="581" font-size="23" fill="#a8a49b">answer traced to its source.</text>

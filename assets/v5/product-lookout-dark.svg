<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 653" width="600" height="653" role="img" aria-label="Lookout. Early access. One private memory of your meetings that you can ask from Claude Code, with every answer traced to its source."><style>.s{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
.edge{stroke-dasharray:140 2400;animation:e 9s linear infinite}@keyframes e{to{stroke-dashoffset:-2540}}
.walk{animation:w 7s cubic-bezier(.6,0,.4,1) infinite}</style>
<defs><clipPath id="c"><rect width="600" height="653" rx="22"/></clipPath></defs>
<rect width="600" height="653" rx="22" fill="#0e0e12"/>
